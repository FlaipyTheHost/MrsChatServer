# Configuração do MrsChatServer. Argumentos de linha de comando têm prioridade.
porta=9000

# Nome mostrado no cabeçalho dos clientes.
sala=MrsChat

# Deixe em branco para sala aberta.
senha=

max_clientes=50

# publico=sim abre um túnel para amigos fora da sua rede (funciona atrás de CGNAT).
publico=nao
relay=bore.pub
relay_segredo=
porta_publica=0

# Criptografia: a chave de identidade é criada na primeira execução. Guarde-a.
chave=MrsChatServer.chave
# sim = aceita clientes antigos, sem criptografia (o tráfego deles vai em texto puro).
aceitar_sem_cripto=nao

# painel (padrão) ou simples (log linha a linha, bom para rodar como serviço).
interface=painel
